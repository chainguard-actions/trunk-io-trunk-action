name: Test populate_cache_only check mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake trunk binary and config
        run: |
          mkdir -p .trunk/bin
          cat > .trunk/bin/trunk <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            version)
              echo "1.22.2"
              ;;
            install)
              echo "Trunk install complete"
              ;;
            *)
              echo "fake-trunk: $*"
              ;;
          esac
          exit 0
          SCRIPT
          chmod +x .trunk/bin/trunk

          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      - id: action
        uses: .
        with:
          check-mode: populate_cache_only
          cache: "false"
        continue-on-error: true

      - name: Assert action completed with populate_cache_only mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with check-mode=populate_cache_only"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
