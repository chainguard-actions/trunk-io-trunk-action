name: Test check-run-id and upload-series inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config and fake trunk binary
        run: |
          mkdir -p .trunk/bin
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF
          # Create a fake trunk binary so locate_trunk.sh doesn't download from internet
          cat > .trunk/bin/trunk <<'SCRIPT'
          #!/bin/bash
          if [[ "$1" == "version" ]]; then
            echo "1.22.2"
            exit 0
          fi
          exit 0
          SCRIPT
          chmod +x .trunk/bin/trunk

      - id: action
        uses: .
        with:
          check-mode: none
          cache: "false"
          check-run-id: "12345"
          upload-series: "main-branch"

      - name: Assert action completed with check-run-id and upload-series inputs
        run: |
          echo "PASS: action completed with check-run-id and upload-series inputs"
