name: Test check-mode none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config to skip auto-init
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.6
          EOF

      - id: action
        uses: .
        with:
          check-mode: none
          cache: "false"

      - name: Assert action completed without running checks
        run: |
          echo "Action completed successfully with check-mode=none"
          echo "PASS"
