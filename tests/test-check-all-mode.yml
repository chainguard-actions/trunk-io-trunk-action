name: Test check-all-mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config to avoid auto-init
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      - id: action
        uses: .
        with:
          check-mode: none
          check-all-mode: "hold-the-line"

      - name: Assert action succeeded with check-all-mode set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with check-all-mode=hold-the-line in none mode, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded with check-all-mode=hold-the-line"
