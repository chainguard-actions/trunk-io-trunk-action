name: Test debug mode and log output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake trunk binary and config
        run: |
          mkdir -p .trunk/bin .trunk/logs
          cat > .trunk/bin/trunk <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            version)
              echo "1.22.2"
              ;;
            *)
              echo "fake-trunk: $*"
              ;;
          esac
          exit 0
          SCRIPT
          chmod +x .trunk/bin/trunk

          # Create minimal trunk.yaml
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

          # Create fake log files
          echo "fake cli log content" > .trunk/logs/cli.log
          echo "fake daemon log content" > .trunk/logs/daemon.log

      - id: action
        uses: .
        with:
          check-mode: none
          debug: "false"
          cat-trunk-debug-logs: "true"
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with debug mode and log output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
