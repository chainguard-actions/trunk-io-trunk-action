name: Test trunk-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake trunk binary at custom path
        run: |
          mkdir -p /tmp/custom-trunk-dir
          cat > /tmp/custom-trunk-dir/trunk <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            version)
              echo "1.22.2-custom"
              ;;
            *)
              echo "custom-fake-trunk: $*"
              ;;
          esac
          exit 0
          SCRIPT
          chmod +x /tmp/custom-trunk-dir/trunk

          # Create minimal trunk.yaml
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      - id: action
        uses: .
        with:
          check-mode: none
          trunk-path: /tmp/custom-trunk-dir/trunk
        continue-on-error: true

      - name: Assert action completed with custom trunk-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom trunk-path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
