name: Test cleanup script
on:
  workflow_dispatch:

jobs:
  test-cleanup-removes-tmpdir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake trunk environment
        run: |
          # Create a fake trunk binary that handles all trunk commands
          mkdir -p .trunk/bin
          cat > .trunk/bin/trunk << 'TRUNKEOF'
          #!/bin/bash
          case "$1" in
            version) echo "1.22.6"; exit 0 ;;
            --ci) echo "fake trunk init"; exit 0 ;;
            install) echo "fake trunk install"; exit 0 ;;
            check) echo "fake trunk check"; exit 0 ;;
            *) echo "fake trunk: $*"; exit 0 ;;
          esac
          TRUNKEOF
          chmod +x .trunk/bin/trunk
          .trunk/bin/trunk version

          # Create a minimal trunk.yaml so "Init on-demand" is skipped
          cat > .trunk/trunk.yaml << 'EOF'
          version: 0.1
          cli:
            version: 1.22.6
          EOF

      - name: Test cleanup logic inline
        run: |
          # Test cleanup logic: if TRUNK_TMPDIR is set, remove it
          TRUNK_TMPDIR="$(mktemp -d)"
          echo "Created TRUNK_TMPDIR: $TRUNK_TMPDIR"
          touch "$TRUNK_TMPDIR/test-file.txt"
          echo "Files in TRUNK_TMPDIR before cleanup:"
          ls -la "$TRUNK_TMPDIR"

          # Simulate cleanup.sh logic
          if [[ -n ${TRUNK_TMPDIR+x} ]]; then
            rm -rf "${TRUNK_TMPDIR}"
          fi

          if [ -d "$TRUNK_TMPDIR" ]; then
            echo "FAIL: TRUNK_TMPDIR still exists after cleanup"
            exit 1
          else
            echo "PASS: TRUNK_TMPDIR was removed by cleanup logic"
          fi

      - name: Test cleanup logic with no TRUNK_TMPDIR
        run: |
          # Test that cleanup logic handles missing TRUNK_TMPDIR gracefully
          unset TRUNK_TMPDIR
          # Simulate cleanup.sh logic
          if [[ -n ${TRUNK_TMPDIR+x} ]]; then
            rm -rf "${TRUNK_TMPDIR}"
          fi
          echo "PASS: cleanup logic succeeded with no TRUNK_TMPDIR set"

      - id: action
        uses: .
        with:
          check-mode: none
          cache: "false"
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
