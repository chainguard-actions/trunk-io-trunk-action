name: Test trunk-merge check mode detection
on:
  workflow_dispatch:

jobs:
  test-trunk-merge-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify trunk_merge mode detected for push to trunk-merge branch
        run: |
          # Simulate determine_check_mode.sh logic inline (avoid symlink issues)
          TMPENV="$(mktemp)"
          INPUT_CHECK_MODE="" \
          GITHUB_EVENT_NAME="push" \
          GITHUB_REF_NAME="trunk-merge/main" \
          INPUT_DEBUG="false" \
          GITHUB_ENV="$TMPENV" \
          bash -c '
            check_mode="${INPUT_CHECK_MODE}"
            if [[ -z ${check_mode} ]]; then
              if [[ ${GITHUB_EVENT_NAME} == "pull_request" || ${GITHUB_EVENT_NAME} == "pull_request_target" ]]; then
                check_mode="pull_request"
              elif [[ ${GITHUB_EVENT_NAME} == "push" && (${GITHUB_REF_NAME} == trunk-merge/* || ${GITHUB_REF_NAME} == trunk-merge-beta/*) ]]; then
                check_mode="trunk_merge"
              elif [[ ${GITHUB_EVENT_NAME} == "push" ]]; then
                check_mode="push"
              elif [[ ${GITHUB_EVENT_NAME} == "workflow_dispatch" && (${GITHUB_REF_NAME} == trunk-merge/* || ${GITHUB_REF_NAME} == trunk-merge-beta/*) ]]; then
                check_mode="trunk_merge"
              elif [[ ${GITHUB_EVENT_NAME} == "workflow_dispatch" || ${GITHUB_EVENT_NAME} == "schedule" ]]; then
                check_mode="all"
              else
                check_mode="none"
              fi
            fi
            echo "TRUNK_CHECK_MODE=${check_mode}" >>"${GITHUB_ENV}"
          '
          MODE=$(grep "TRUNK_CHECK_MODE=" "$TMPENV" | cut -d= -f2)
          echo "Detected mode: $MODE"
          if [ "$MODE" = "trunk_merge" ]; then
            echo "PASS: push to trunk-merge/* detected as 'trunk_merge'"
          else
            echo "FAIL: expected 'trunk_merge' but got '$MODE'"
            exit 1
          fi

      - name: Verify populate_cache_only mode is preserved when explicitly set
        run: |
          TMPENV="$(mktemp)"
          INPUT_CHECK_MODE="populate_cache_only" \
          GITHUB_EVENT_NAME="workflow_dispatch" \
          GITHUB_REF_NAME="main" \
          INPUT_DEBUG="false" \
          GITHUB_ENV="$TMPENV" \
          bash -c '
            check_mode="${INPUT_CHECK_MODE}"
            if [[ -z ${check_mode} ]]; then
              check_mode="none"
            elif [[ ${check_mode} != "all" && ${check_mode} != "none" && ${check_mode} != "populate_cache_only" && ${check_mode} != "pull_request" && ${check_mode} != "push" && ${check_mode} != "trunk_merge" ]]; then
              echo "invalid check mode"
              exit 1
            fi
            echo "TRUNK_CHECK_MODE=${check_mode}" >>"${GITHUB_ENV}"
          '
          MODE=$(grep "TRUNK_CHECK_MODE=" "$TMPENV" | cut -d= -f2)
          echo "Detected mode: $MODE"
          if [ "$MODE" = "populate_cache_only" ]; then
            echo "PASS: explicit 'populate_cache_only' mode preserved"
          else
            echo "FAIL: expected 'populate_cache_only' but got '$MODE'"
            exit 1
          fi

      - name: Verify none mode is preserved when explicitly set
        run: |
          TMPENV="$(mktemp)"
          INPUT_CHECK_MODE="none" \
          GITHUB_EVENT_NAME="workflow_dispatch" \
          GITHUB_REF_NAME="main" \
          INPUT_DEBUG="false" \
          GITHUB_ENV="$TMPENV" \
          bash -c '
            check_mode="${INPUT_CHECK_MODE}"
            if [[ -z ${check_mode} ]]; then
              check_mode="none"
            elif [[ ${check_mode} != "all" && ${check_mode} != "none" && ${check_mode} != "populate_cache_only" && ${check_mode} != "pull_request" && ${check_mode} != "push" && ${check_mode} != "trunk_merge" ]]; then
              echo "invalid check mode"
              exit 1
            fi
            echo "TRUNK_CHECK_MODE=${check_mode}" >>"${GITHUB_ENV}"
          '
          MODE=$(grep "TRUNK_CHECK_MODE=" "$TMPENV" | cut -d= -f2)
          echo "Detected mode: $MODE"
          if [ "$MODE" = "none" ]; then
            echo "PASS: explicit 'none' mode preserved"
          else
            echo "FAIL: expected 'none' but got '$MODE'"
            exit 1
          fi

      - name: Set up fake trunk environment for action
        run: |
          # Create a fake trunk binary that handles all trunk commands
          mkdir -p .trunk/bin
          cat > .trunk/bin/trunk << 'TRUNKEOF'
          #!/bin/bash
          case "$1" in
            version) echo "1.22.6"; exit 0 ;;
            --ci) echo "fake trunk init"; exit 0 ;;
            install) echo "fake trunk install"; exit 0 ;;
            check) echo "fake trunk check"; exit 0 ;;
            *) echo "fake trunk: $*"; exit 0 ;;
          esac
          TRUNKEOF
          chmod +x .trunk/bin/trunk
          .trunk/bin/trunk version

          # Create a minimal trunk.yaml so "Init on-demand" is skipped
          cat > .trunk/trunk.yaml << 'EOF'
          version: 0.1
          cli:
            version: 1.22.6
          EOF

      - id: action
        uses: .
        with:
          check-mode: none
          cache: "false"
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
