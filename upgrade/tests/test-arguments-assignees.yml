name: Test arguments and assignees inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          arguments: "--linter eslint"
          assignees: "octocat"
          base: main
          labels: trunk

      - name: Assert action ran with arguments and assignees inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (arguments and assignees inputs exercised)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
