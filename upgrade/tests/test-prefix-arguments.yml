name: Test prefix, arguments, assignees, and reviewers inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prefix: "[chore] "
          arguments: "--dry-run"
          assignees: "octocat"
          reviewers: "octocat"
          base: main
          branch-name: trunk-io/update-trunk-test
          labels: trunk,automated
          add-paths: .trunk
          lowercase-title: "true"
          signoff: "true"
          sign-commits: "false"
          setup-deps: "false"

      - name: Assert action ran (prefix/arguments/assignees/reviewers inputs accepted, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - missing locate_trunk.sh or .trunk/trunk.yaml or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
