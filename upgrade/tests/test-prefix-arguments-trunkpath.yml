name: Test prefix, arguments, and trunk-path inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .trunk/trunk.yaml so the action passes the config check.
      # The action will still fail when trying to run trunk upgrade (trunk not installed),
      # or when creating a PR against the sentinel repo.
      - name: Create minimal trunk config
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      # Create a fake trunk binary to satisfy the trunk-path input.
      - name: Create fake trunk binary
        run: |
          mkdir -p /tmp/fake-trunk-bin
          cat > /tmp/fake-trunk-bin/trunk <<'EOF'
          #!/bin/bash
          # Fake trunk: simulate "Already up to date" for upgrade
          if [[ "$*" == *"upgrade"* ]]; then
            echo "Already up to date"
            exit 0
          fi
          if [[ "$*" == *"daemon shutdown"* ]]; then
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-trunk-bin/trunk

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: /tmp/fake-trunk-bin/trunk
          prefix: "[auto] "
          arguments: --no-progress
          base: main
          branch-name: trunk-io/update-trunk-prefix-test
          labels: trunk
          add-paths: .trunk
          github-token: ${{ github.token }}

      - name: Assert action ran with prefix/arguments/trunk-path inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (already up to date) or fail (PR creation on sentinel repo).
          # Either outcome is acceptable — we just verify it ran and didn't crash unexpectedly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with prefix, arguments, and trunk-path inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
