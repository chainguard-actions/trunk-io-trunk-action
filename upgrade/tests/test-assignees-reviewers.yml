name: Test assignees and reviewers inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .trunk/trunk.yaml so the action passes the config check.
      - name: Create minimal trunk config
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          EOF

      # Create a fake trunk binary that simulates "Already up to date".
      - name: Create fake trunk binary
        run: |
          mkdir -p /tmp/fake-trunk-bin
          cat > /tmp/fake-trunk-bin/trunk <<'EOF'
          #!/bin/bash
          # Fake trunk: simulate "Already up to date" for upgrade
          if [[ "$*" == *"upgrade"* ]]; then
            echo "Already up to date"
            exit 0
          fi
          if [[ "$*" == *"daemon shutdown"* ]]; then
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-trunk-bin/trunk

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: /tmp/fake-trunk-bin/trunk
          assignees: octocat
          reviewers: octocat
          base: main
          branch-name: trunk-io/update-trunk-assignees-test
          labels: trunk
          add-paths: .trunk
          github-token: ${{ github.token }}

      - name: Assert action ran with assignees and reviewers inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (already up to date, no PR needed) or fail
          # (PR creation fails on sentinel repo). Either is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with assignees and reviewers inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
