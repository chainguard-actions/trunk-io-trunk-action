name: Test PR outputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal .trunk/trunk.yaml and fake trunk binary that reports upgrades
        run: |
          mkdir -p .trunk/bin
          cat > .trunk/trunk.yaml << 'EOF'
          version: 0.1
          cli:
            version: 1.22.0
          EOF
          # Create a fake trunk binary that simulates an upgrade being available
          cat > .trunk/bin/trunk << 'EOF'
          #!/bin/sh
          case "$*" in
            *upgrade*)
              echo "upgrade"
              echo "  cli upgrade 1.23.0"
              echo "  tool upgrade some-tool 2.0.0"
              exit 0
              ;;
            *daemon*shutdown*)
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
          chmod +x .trunk/bin/trunk

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: .trunk/bin/trunk
          base: main
          branch-name: trunk-io/update-trunk-test
          labels: trunk
          add-paths: .trunk
          signoff: "false"
          sign-commits: "false"

      - name: Assert action ran and outputs are set or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          elif [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, PR outputs should be set
            if [ -z "$PR_NUMBER" ] && [ -z "$PR_URL" ]; then
              echo "WARN: action succeeded but no PR was created (trunk may have reported no changes)"
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or missing trunk)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
