name: Test basic usage with trunk-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake trunk binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/trunk" << 'EOF'
          #!/bin/sh
          echo "Already up to date"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/trunk"

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: "${{ github.workspace }}/bin/trunk"
          base: main
          branch-name: trunk-io/update-trunk
          labels: trunk
          add-paths: .trunk
          lowercase-title: "false"
          signoff: "false"
          sign-commits: "false"
          setup-deps: "false"

      - name: Assert action ran (trunk-path input accepted, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - missing locate_trunk.sh or .trunk/trunk.yaml)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
