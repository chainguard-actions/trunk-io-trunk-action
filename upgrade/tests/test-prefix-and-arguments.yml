name: Test prefix and arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.1
          EOF

      - name: Create a fake trunk binary
        run: |
          mkdir -p /tmp/fake-trunk-bin
          cat > /tmp/fake-trunk-bin/trunk <<'SCRIPT'
          #!/bin/sh
          # Fake trunk binary for testing - simulates "already up to date"
          echo "Already up to date"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-trunk-bin/trunk
          echo "/tmp/fake-trunk-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: /tmp/fake-trunk-bin/trunk
          prefix: "[chore] "
          arguments: --only-bump-policy
          base: main
          branch-name: trunk-io/update-trunk-prefix-test

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
