name: Test missing trunk.yaml error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no trunk.yaml exists
        run: |
          rm -f .trunk/trunk.yaml

      - id: action
        uses: .
        continue-on-error: true
        with:
          trunk-path: /usr/local/bin/trunk
          prefix: "[auto] "
          arguments: ""
          assignees: ""
          reviewers: ""
          base: main
          branch-name: trunk-io/update-trunk-missing-test

      - name: Assert action failed gracefully due to missing trunk.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when .trunk/trunk.yaml is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when .trunk/trunk.yaml is missing"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
