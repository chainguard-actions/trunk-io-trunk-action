name: Test with explicit trunk-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake trunk binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-bin"
          cat > "$GITHUB_WORKSPACE/fake-bin/trunk" << 'EOF'
          #!/bin/sh
          if [ "$1" = "version" ]; then
            echo "fake-trunk 0.0.0"
            exit 0
          fi
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/fake-bin/trunk"
          echo "Fake trunk created at $GITHUB_WORKSPACE/fake-bin/trunk"

      - id: action
        uses: .
        with:
          trunk-path: ${{ github.workspace }}/fake-bin/trunk

      - name: Assert TRUNK_PATH is set to the provided path
        run: |
          echo "TRUNK_PATH: $TRUNK_PATH"
          EXPECTED="$GITHUB_WORKSPACE/fake-bin/trunk"
          echo "Expected: $EXPECTED"
          if [ "$TRUNK_PATH" != "$EXPECTED" ]; then
            echo "FAIL: expected TRUNK_PATH='$EXPECTED' but got '$TRUNK_PATH'"
            exit 1
          fi
          echo "PASS: TRUNK_PATH matches the provided trunk-path input"

      - name: Assert TRUNK_TMPDIR env var is set
        run: |
          echo "TRUNK_TMPDIR: $TRUNK_TMPDIR"
          if [ -z "$TRUNK_TMPDIR" ]; then
            echo "FAIL: TRUNK_TMPDIR env var was not set"
            exit 1
          fi
          echo "PASS: TRUNK_TMPDIR is set to '$TRUNK_TMPDIR'"
