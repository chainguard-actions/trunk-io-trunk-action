name: Test explicit trunk-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake trunk binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-tools"
          cat > "$GITHUB_WORKSPACE/fake-tools/trunk" << 'EOF'
          #!/bin/sh
          echo "fake-trunk version 0.0.0-test"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/fake-tools/trunk"
          echo "Fake trunk created at: $GITHUB_WORKSPACE/fake-tools/trunk"

      - id: action
        name: Run action with explicit trunk-path
        uses: .
        with:
          trunk-path: fake-tools/trunk

      - name: Assert TRUNK_PATH is set to the provided path
        run: |
          echo "TRUNK_PATH=${TRUNK_PATH}"
          if [ -z "${TRUNK_PATH}" ]; then
            echo "FAIL: TRUNK_PATH env var is not set"
            exit 1
          fi
          # The action sets TRUNK_PATH to the value of trunk-path input
          if [ "${TRUNK_PATH}" != "fake-tools/trunk" ]; then
            echo "FAIL: expected TRUNK_PATH=fake-tools/trunk but got TRUNK_PATH=${TRUNK_PATH}"
            exit 1
          fi
          echo "PASS: TRUNK_PATH=${TRUNK_PATH}"

      - name: Assert TRUNK_TMPDIR env var is set
        run: |
          echo "TRUNK_TMPDIR=${TRUNK_TMPDIR}"
          if [ -z "${TRUNK_TMPDIR}" ]; then
            echo "FAIL: TRUNK_TMPDIR env var is not set"
            exit 1
          fi
          echo "PASS: TRUNK_TMPDIR=${TRUNK_TMPDIR}"
