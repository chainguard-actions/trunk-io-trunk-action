name: Test basic usage (no trunk-path input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert TRUNK_PATH env var is set
        run: |
          echo "TRUNK_PATH: $TRUNK_PATH"
          echo "TRUNK_TMPDIR: $TRUNK_TMPDIR"
          if [ -z "$TRUNK_PATH" ]; then
            echo "FAIL: TRUNK_PATH env var was not set"
            exit 1
          fi
          echo "PASS: TRUNK_PATH is set to '$TRUNK_PATH'"

      - name: Assert TRUNK_TMPDIR env var is set
        run: |
          echo "TRUNK_TMPDIR: $TRUNK_TMPDIR"
          if [ -z "$TRUNK_TMPDIR" ]; then
            echo "FAIL: TRUNK_TMPDIR env var was not set"
            exit 1
          fi
          echo "PASS: TRUNK_TMPDIR is set to '$TRUNK_TMPDIR'"
