name: Trunk Check
author: trunk.io
description: The official trunk.io GitHub action
branding:
  icon: check
  color: green
inputs:
  trunk-path:
    description: Path to Trunk Launcher. If not provided, we'll look for it the repo root, `.trunk/bin` and `tools/`. If it can't be found anywhere and is not provided explicitly, we'll download it on demand.
    required: false
  label:
    description: Label to append to the check run name (useful if running Trunk Check on multiple platforms)
    deprecationMessage: "Use `arguments: --github-label=value` instead."
    required: false
  arguments:
    description: Extra arguments to pass to trunk
    required: false
  check-mode:
    description: Trunk check mode. Leave unset to autodetect. Set to 'all' to check the entire repository. Set to 'populate_cache_only' in a dedicated workflow to populate the GitHub Actions cache with Trunk artifacts (see docs for more details).
    required: false
  check-all-mode:
    description: If set to "hold-the-line", computes new/existing issues by comparing to previous upload.
    deprecationMessage: The Trunk web app has been shut down; hold-the-line uploads are no longer supported.
    required: false
    default: ""
  cache:
    description: Cache trunk downloads and results between runs. Caching is only needed when using ephemeral CI runners.
    required: false
    default: "true"
  cache-key:
    description: A key unique to the repo/branch this action is being run on (e.g. the repo name and branch)
    required: false
  post-init:
    description: Trusted shell to run after auto-init / before check (caller-controlled escape hatch).
    required: false
  github-token:
    description: GitHub token for API/checkout. Defaults to github.token; pass a PAT/App secret only for extra permissions.
    required: false
    default: ${{ github.token }}
  trunk-token:
    description: You can find a per-repo API token in the Trunk web app settings. This will cause results to be uploaded to the Trunk web app if this job is a scheduled job running on a branch, or if `check-mode` is set to 'all'.
    deprecationMessage: The Trunk web app has been shut down; uploads are no longer supported.
    required: false
  upload-series:
    description: Upload series name, for when `trunk-token` is provided. If not provided, we'll use the branch name.
    deprecationMessage: The Trunk web app has been shut down; uploads are no longer supported.
    required: false
  save-annotations:
    description: Save annotations as an artifact instead of posting them from this action. This is neccesary if your repository will be used with forks as they will will not have permissions to upload annotations. By default forks will be auto-detected.
    required: false
    default: auto
  post-annotations:
    description: Post annotations previously uploaded with the `save-annotations` option (specific to posting annotations from forks).
    required: false
    default: "false"
  setup-deps:
    description: Install dependencies for trunk check that the trunk CLI does not manage. This is only necessary if you have Node dependencies in your package.json that your Node linters need (e.g. eslint dependencies, or @types packages).
    required: false
    default: "false"
  debug:
    description: Internal use only
    required: false
    default: "false"
  timeout-seconds:
    description: Timeout seconds before we kill the long running trunk check process via unix timeout command. Default setting of 0 seconds disables the timeout.
    required: false
    default: 0
  cat-trunk-debug-logs:
    description: Option to cat .trunk/logs/cli.log && .trunk/logs/daemon.log
    required: false
    default: false
  lfs-checkout:
    description: Option to checkout LFS files
    required: false
    default: true
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up inputs
      shell: bash
      env:
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_CHECK_MODE_EXPR: ${{ inputs.check-mode }}
        GITHUB_TOKEN_EXPR: ${{ github.token }}
        INPUT_GITHUB_TOKEN_EXPR: ${{ inputs.github-token }}
        INPUT_TRUNK_TOKEN_EXPR: ${{ inputs.trunk-token }}
        PR_BASE_SHA_EXPR: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_REPO_FORK_EXPR: ${{ github.event.pull_request.head.repo.fork }}
        PR_HEAD_SHA_EXPR: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER_EXPR: ${{ github.event.pull_request.number }}
        GITHUB_REF_NAME_EXPR: ${{ github.ref_name }}
        INPUT_ARGUMENTS_EXPR: ${{ inputs.arguments }}
        INPUT_CACHE_EXPR: ${{ inputs.cache }}
        INPUT_CACHE_KEY_EXPR: ${{ inputs.cache-key }}
        RUNNER_OS_EXPR: ${{ runner.os }}
        TRUNK_YAML_HASH_EXPR: ${{ hashFiles('.trunk/trunk.yaml') }}
        INPUT_CAT_TRUNK_DEBUG_LOGS_EXPR: ${{ inputs.cat-trunk-debug-logs }}
        INPUT_CHECK_ALL_MODE_EXPR: ${{ inputs.check-all-mode }}
        INPUT_DEBUG_EXPR: ${{ inputs.debug }}
        INPUT_LABEL_EXPR: ${{ inputs.label }}
        INPUT_SETUP_DEPS_EXPR: ${{ inputs.setup-deps }}
        INPUT_TRUNK_PATH_EXPR: ${{ inputs.trunk-path }}
        INPUT_UPLOAD_SERIES_EXPR: ${{ inputs.upload-series }}
        INPUT_LFS_CHECKOUT_EXPR: ${{ inputs.lfs-checkout }}
      run: |
        echo "TRUNK_LAUNCHER_QUIET=false" >>"${GITHUB_ENV}"
        safe_timeout=$(printf '%s' "${INPUT_TIMEOUT_SECONDS}" | tr -d '\n\r')
        echo "INPUT_TIMEOUT_SECONDS=${safe_timeout}" >>"${GITHUB_ENV}"

        # First arg is field to fetch, second arg is default value or empty
        payload() {
          if [ $# -lt 2 ]; then
            DEFAULT_VALUE=empty
          else
            DEFAULT_VALUE=\"$2\"
          fi
          if command -v jq >/dev/null; then
            jq -r ".inputs.payload | fromjson | .$1 // ${DEFAULT_VALUE}" ${TEST_GITHUB_EVENT_PATH:-${GITHUB_EVENT_PATH}}
          else
            echo "::error::jq not installed on system!"
            exit 1
          fi
        }

        # Every inputs.field should be referenced as INPUT_FIELD later in the action. This allows
        # the field to be set either as an argument to the github action or via inputs.json.
        if [[ "${INPUT_CHECK_MODE_EXPR}" == "payload" ]]; then

          raw_github_token=$(payload githubToken)
          if [[ -z ${raw_github_token} ]]; then
            # Fall back to the workflow's default token when the payload omits one so
            # GITHUB_TOKEN is never empty (payload mode previously always inherited github.token).
            raw_github_token=${GITHUB_TOKEN_EXPR}
          fi
          raw_trunk_token=$(payload trunkToken)
          if [[ -n ${raw_github_token} ]]; then
            echo "::add-mask::${raw_github_token}"
          fi
          if [[ -n ${raw_trunk_token} ]]; then
            echo "::add-mask::${raw_trunk_token}"
          fi

          safe_p_github_token=$(printf '%s' "${raw_github_token}" | tr -d '\n\r')
          safe_p_trunk_token=$(printf '%s' "${raw_trunk_token}" | tr -d '\n\r')
          raw_p_trunk_api_address=$(payload trunkApiAddress)
          safe_p_trunk_api_address=$(printf '%s' "${raw_p_trunk_api_address}" | tr -d '\n\r')
          raw_p_pr_base_repo_owner=$(payload pullRequest.base.repo.owner.login)
          safe_p_pr_base_repo_owner=$(printf '%s' "${raw_p_pr_base_repo_owner}" | tr -d '\n\r')
          raw_p_pr_base_repo_name=$(payload pullRequest.base.repo.name)
          safe_p_pr_base_repo_name=$(printf '%s' "${raw_p_pr_base_repo_name}" | tr -d '\n\r')
          raw_p_pr_base_sha=$(payload pullRequest.base.sha)
          safe_p_pr_base_sha=$(printf '%s' "${raw_p_pr_base_sha}" | tr -d '\n\r')
          raw_p_pr_head_repo_fork=$(payload pullRequest.head.repo.fork)
          safe_p_pr_head_repo_fork=$(printf '%s' "${raw_p_pr_head_repo_fork}" | tr -d '\n\r')
          raw_p_pr_head_sha=$(payload pullRequest.head.sha)
          safe_p_pr_head_sha=$(printf '%s' "${raw_p_pr_head_sha}" | tr -d '\n\r')
          raw_p_pr_number=$(payload pullRequest.number)
          safe_p_pr_number=$(printf '%s' "${raw_p_pr_number}" | tr -d '\n\r')
          raw_p_arguments=$(payload arguments)
          safe_p_arguments=$(printf '%s' "${raw_p_arguments}" | tr -d '\n\r')
          raw_p_cache=$(payload cache)
          safe_p_cache=$(printf '%s' "${raw_p_cache}" | tr -d '\n\r')
          raw_p_cache_key=$(payload cacheKey)
          safe_p_cache_key=$(printf '%s' "${raw_p_cache_key}" | tr -d '\n\r')
          raw_p_cache_path=$(payload cachePath)
          safe_p_cache_path=$(printf '%s' "${raw_p_cache_path}" | tr -d '\n\r')
          raw_p_check_all_mode=$(payload checkAllMode)
          safe_p_check_all_mode=$(printf '%s' "${raw_p_check_all_mode}" | tr -d '\n\r')
          raw_p_check_mode=$(payload checkMode)
          safe_p_check_mode=$(printf '%s' "${raw_p_check_mode}" | tr -d '\n\r')
          raw_p_debug=$(payload debug)
          safe_p_debug=$(printf '%s' "${raw_p_debug}" | tr -d '\n\r')
          raw_p_ref_name=$(payload targetRefName)
          safe_p_ref_name=$(printf '%s' "${raw_p_ref_name}" | tr -d '\n\r')
          raw_p_label=$(payload label)
          safe_p_label=$(printf '%s' "${raw_p_label}" | tr -d '\n\r')
          raw_p_setup_cache_key=$(payload setupCacheKey)
          safe_p_setup_cache_key=$(printf '%s' "${raw_p_setup_cache_key}" | tr -d '\n\r')
          raw_p_setup_deps=$(payload setupDeps)
          safe_p_setup_deps=$(printf '%s' "${raw_p_setup_deps}" | tr -d '\n\r')
          raw_p_target_checkout=$(payload targetCheckout)
          safe_p_target_checkout=$(printf '%s' "${raw_p_target_checkout}" | tr -d '\n\r')
          raw_p_target_checkout_ref=$(payload targetCheckoutRef)
          safe_p_target_checkout_ref=$(printf '%s' "${raw_p_target_checkout_ref}" | tr -d '\n\r')
          raw_p_trunk_path=$(payload trunkPath)
          safe_p_trunk_path=$(printf '%s' "${raw_p_trunk_path}" | tr -d '\n\r')
          raw_p_upload_landing_state=$(payload uploadLandingState)
          safe_p_upload_landing_state=$(printf '%s' "${raw_p_upload_landing_state}" | tr -d '\n\r')
          raw_p_upload_series=$(payload uploadSeries)
          safe_p_upload_series=$(printf '%s' "${raw_p_upload_series}" | tr -d '\n\r')
          raw_p_upload_id=$(payload uploadId)
          safe_p_upload_id=$(printf '%s' "${raw_p_upload_id}" | tr -d '\n\r')
          raw_p_autofix_and_push=$(payload autofixAndPush)
          safe_p_autofix_and_push=$(printf '%s' "${raw_p_autofix_and_push}" | tr -d '\n\r')
          raw_p_lfs_checkout=$(payload lfsCheckout true)
          safe_p_lfs_checkout=$(printf '%s' "${raw_p_lfs_checkout}" | tr -d '\n\r')

          cat >>$GITHUB_ENV <<EOF
        GITHUB_TOKEN=${safe_p_github_token}
        INPUT_GITHUB_TOKEN=${safe_p_github_token}
        INPUT_TRUNK_TOKEN=${safe_p_trunk_token}
        TRUNK_TOKEN=${safe_p_trunk_token}
        TRUNK_API_ADDRESS=${safe_p_trunk_api_address}
        GITHUB_EVENT_PULL_REQUEST_BASE_REPO_OWNER=${safe_p_pr_base_repo_owner}
        GITHUB_EVENT_PULL_REQUEST_BASE_REPO_NAME=${safe_p_pr_base_repo_name}
        GITHUB_EVENT_PULL_REQUEST_BASE_SHA=${safe_p_pr_base_sha}
        GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK=${safe_p_pr_head_repo_fork}
        GITHUB_EVENT_PULL_REQUEST_HEAD_SHA=${safe_p_pr_head_sha}
        GITHUB_EVENT_PULL_REQUEST_NUMBER=${safe_p_pr_number}
        INPUT_ARGUMENTS=${safe_p_arguments}
        INPUT_CACHE=${safe_p_cache}
        INPUT_CACHE_KEY=${safe_p_cache_key}
        INPUT_CACHE_PATH=${safe_p_cache_path}
        INPUT_CHECK_ALL_MODE=${safe_p_check_all_mode}
        INPUT_CHECK_MODE=${safe_p_check_mode}
        INPUT_DEBUG=${safe_p_debug}
        INPUT_GITHUB_REF_NAME=${safe_p_ref_name}
        INPUT_LABEL=${safe_p_label}
        INPUT_SETUP_CACHE_KEY=${safe_p_setup_cache_key}
        INPUT_SETUP_DEPS=${safe_p_setup_deps}
        INPUT_TARGET_CHECKOUT=${safe_p_target_checkout}
        INPUT_TARGET_CHECKOUT_REF=${safe_p_target_checkout_ref}
        INPUT_TRUNK_PATH=${safe_p_trunk_path}
        INPUT_UPLOAD_LANDING_STATE=${safe_p_upload_landing_state}
        INPUT_UPLOAD_SERIES=${safe_p_upload_series}
        INPUT_UPLOAD_ID=${safe_p_upload_id}
        INPUT_AUTOFIX_AND_PUSH=${safe_p_autofix_and_push}
        INPUT_LFS_CHECKOUT=${safe_p_lfs_checkout}
        EOF

        else

          if [[ -n "${INPUT_GITHUB_TOKEN_EXPR}" ]]; then
            echo "::add-mask::${INPUT_GITHUB_TOKEN_EXPR}"
          fi
          if [[ -n "${INPUT_TRUNK_TOKEN_EXPR}" ]]; then
            echo "::add-mask::${INPUT_TRUNK_TOKEN_EXPR}"
          fi

          safe_github_token=$(printf '%s' "${INPUT_GITHUB_TOKEN_EXPR}" | tr -d '\n\r')
          safe_trunk_token=$(printf '%s' "${INPUT_TRUNK_TOKEN_EXPR}" | tr -d '\n\r')
          safe_pr_base_sha=$(printf '%s' "${PR_BASE_SHA_EXPR}" | tr -d '\n\r')
          safe_pr_head_repo_fork=$(printf '%s' "${PR_HEAD_REPO_FORK_EXPR}" | tr -d '\n\r')
          safe_pr_head_sha=$(printf '%s' "${PR_HEAD_SHA_EXPR}" | tr -d '\n\r')
          safe_pr_number=$(printf '%s' "${PR_NUMBER_EXPR}" | tr -d '\n\r')
          safe_ref_name=$(printf '%s' "${GITHUB_REF_NAME_EXPR}" | tr -d '\n\r')
          safe_arguments=$(printf '%s' "${INPUT_ARGUMENTS_EXPR}" | tr -d '\n\r')
          safe_cache=$(printf '%s' "${INPUT_CACHE_EXPR}" | tr -d '\n\r')
          safe_cache_key=$(printf '%s' "${INPUT_CACHE_KEY_EXPR}" | tr -d '\n\r')
          safe_runner_os=$(printf '%s' "${RUNNER_OS_EXPR}" | tr -d '\n\r')
          safe_trunk_yaml_hash=$(printf '%s' "${TRUNK_YAML_HASH_EXPR}" | tr -d '\n\r')
          safe_cat_debug=$(printf '%s' "${INPUT_CAT_TRUNK_DEBUG_LOGS_EXPR}" | tr -d '\n\r')
          safe_check_all_mode=$(printf '%s' "${INPUT_CHECK_ALL_MODE_EXPR}" | tr -d '\n\r')
          safe_check_mode=$(printf '%s' "${INPUT_CHECK_MODE_EXPR}" | tr -d '\n\r')
          safe_debug=$(printf '%s' "${INPUT_DEBUG_EXPR}" | tr -d '\n\r')
          safe_label=$(printf '%s' "${INPUT_LABEL_EXPR}" | tr -d '\n\r')
          safe_setup_deps=$(printf '%s' "${INPUT_SETUP_DEPS_EXPR}" | tr -d '\n\r')
          safe_trunk_path=$(printf '%s' "${INPUT_TRUNK_PATH_EXPR}" | tr -d '\n\r')
          safe_upload_series=$(printf '%s' "${INPUT_UPLOAD_SERIES_EXPR}" | tr -d '\n\r')
          safe_lfs_checkout=$(printf '%s' "${INPUT_LFS_CHECKOUT_EXPR}" | tr -d '\n\r')

          cat >>$GITHUB_ENV <<EOF
        GITHUB_TOKEN=${safe_github_token}
        INPUT_GITHUB_TOKEN=${safe_github_token}
        INPUT_TRUNK_TOKEN=${safe_trunk_token}
        TRUNK_TOKEN=${safe_trunk_token}
        GITHUB_EVENT_PULL_REQUEST_BASE_SHA=${safe_pr_base_sha}
        GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK=${safe_pr_head_repo_fork}
        GITHUB_EVENT_PULL_REQUEST_HEAD_SHA=${safe_pr_head_sha}
        GITHUB_EVENT_PULL_REQUEST_NUMBER=${safe_pr_number}
        GITHUB_REF_NAME=${safe_ref_name}
        INPUT_ARGUMENTS=${safe_arguments}
        INPUT_CACHE=${safe_cache}
        INPUT_CACHE_KEY=trunk-${safe_cache_key}-${safe_runner_os}-${safe_trunk_yaml_hash}
        INPUT_CACHE_PATH=~/.cache/trunk
        INPUT_CAT_TRUNK_DEBUG_LOGS=${safe_cat_debug}
        INPUT_CHECK_ALL_MODE=${safe_check_all_mode}
        INPUT_CHECK_MODE=${safe_check_mode}
        INPUT_DEBUG=${safe_debug}
        INPUT_GITHUB_REF_NAME=${safe_ref_name}
        INPUT_LABEL=${safe_label}
        INPUT_SETUP_CACHE_KEY=${safe_cache_key}
        INPUT_SETUP_DEPS=${safe_setup_deps}
        INPUT_TARGET_CHECKOUT=
        INPUT_TARGET_CHECKOUT_REF=
        INPUT_TRUNK_PATH=${safe_trunk_path}
        INPUT_UPLOAD_LANDING_STATE=false
        INPUT_UPLOAD_SERIES=${safe_upload_series}
        INPUT_UPLOAD_ID=
        INPUT_AUTOFIX_AND_PUSH=
        INPUT_LFS_CHECKOUT=${safe_lfs_checkout}
        EOF

        fi
    - name: Checkout
      if: env.INPUT_TARGET_CHECKOUT
      uses: chainguard-actions/actions-checkout@5ec64c0c3db996bb66e02e8c680b0736fc123f6d # v6.0.2
      with:
        lfs: ${{ env.INPUT_LFS_CHECKOUT && inputs.lfs-checkout }}
        submodules: recursive
        repository: ${{ env.INPUT_TARGET_CHECKOUT }}
        ref: ${{ env.INPUT_TARGET_CHECKOUT_REF }}
        token: ${{ env.INPUT_GITHUB_TOKEN }}
        # Do not persist credentials for later steps; trunk's internal git
        # commands re-authenticate on demand via git_github.sh.
        persist-credentials: false
    - name: Locate trunk
      shell: bash
      run: ${GITHUB_ACTION_PATH}/setup/locate_trunk.sh
    - name: Determine check mode
      shell: bash
      run: |
        # Determine check mode
        ${GITHUB_ACTION_PATH}/determine_check_mode.sh
    - name: Init on-demand
      shell: bash
      run: |
        if [[ ! -e .trunk/trunk.yaml ]]; then
          ${TRUNK_PATH:-trunk} --ci init
          echo "INITIALIZED_TRUNK=true" >>$GITHUB_ENV
        fi
    - name: Detect setup strategy
      shell: bash
      run: |
        if [[ -e .trunk/setup-ci ]]; then
          echo "INPUT_SETUP_DEPS=true" >>$GITHUB_ENV
        else
          mkdir -p .trunk
          ln -s "${GITHUB_ACTION_PATH}/setup-env" .trunk/setup-ci
          echo .trunk/setup-ci >>.git/info/exclude
        fi
    - name: Set up env
      uses: ./.trunk/setup-ci
      if: env.INPUT_SETUP_DEPS == 'true'
      with:
        cache-key: ${{ env.INPUT_SETUP_CACHE_KEY }}
    - name: Post-init steps
      if: inputs.post-init
      shell: bash
      env:
        POST_INIT: ${{ inputs.post-init }}
      run: |
        _post_init_script=$(mktemp)
        printf '%s\n' "$POST_INIT" > "$_post_init_script"
        bash --noprofile --norc -eo pipefail "$_post_init_script"
        rm -f "$_post_init_script"
    - name: Cache Linters/Formatters
      if: env.TRUNK_CHECK_MODE != 'none' && env.INPUT_CACHE == 'true'
      uses: chainguard-actions/actions-cache@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: ${{ env.INPUT_CACHE_PATH }}
        key: ${{ env.INPUT_CACHE_KEY }}
    - name: Run trunk check on pull request
      if: env.TRUNK_CHECK_MODE == 'pull_request'
      shell: bash
      env:
        INPUT_SAVE_ANNOTATIONS: ${{ inputs.save-annotations }}
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh pull_request.sh
    - name: Run trunk check on push
      if: env.TRUNK_CHECK_MODE == 'push'
      shell: bash
      env:
        GITHUB_EVENT_AFTER: ${{ env.GITHUB_EVENT_AFTER || github.event.after }}
        GITHUB_EVENT_BEFORE: ${{ env.GITHUB_EVENT_BEFORE || github.event.before }}
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh push.sh
    - name: Run trunk check on all
      if: env.TRUNK_CHECK_MODE == 'all'
      shell: bash
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh all.sh
    - name: Run trunk check on Trunk Merge
      if: env.TRUNK_CHECK_MODE == 'trunk_merge'
      shell: bash
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh trunk_merge.sh
    - name: Cat Trunk Cli / Daemon logs
      if: always() && inputs.cat-trunk-debug-logs == 'true'
      shell: bash
      run: |
        echo "::group::.trunk/logs/cli.log"
        if [[ -f .trunk/logs/cli.log ]]; then
          cat .trunk/logs/cli.log
        else
          echo ".trunk/logs/cli.log doesn't exist"
        fi
        echo "::endgroup::"

        echo "::group::.trunk/logs/daemon.log"
        if [[ -f .trunk/logs/daemon.log ]]; then
          cat .trunk/logs/daemon.log
        else
          echo ".trunk/logs/daemon.log doesn't exist"
        fi
        echo "::endgroup::"
    - name: Run trunk install to populate the GitHub Actions cache
      if: env.TRUNK_CHECK_MODE == 'populate_cache_only'
      shell: bash
      run: |
        # Run 'trunk install' to populate the GitHub Actions cache
        ${GITHUB_ACTION_PATH}/populate_cache_only.sh
    - name: Upload annotations artifact
      if: always() && env.TRUNK_UPLOAD_ANNOTATIONS == 'true'
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: trunk-annotations
        overwrite: true
        path: ${{ env.TRUNK_TMPDIR }}/annotations.bin
    - name: Download annotations artifact
      if: inputs.post-annotations == 'true'
      uses: chainguard-actions/actions-github-script@90ea3578c9f973abcd1e50255ba3c1cd19216b51 # v9.0.0
      env:
        WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        TRUNK_TMPDIR: ${{ env.TRUNK_TMPDIR }}
      with:
        # TODO(chris): We can't use the official download artifact action yet: https://github.com/actions/download-artifact/issues/172
        script: |
          const runId = Number(process.env.WORKFLOW_RUN_ID);
          let artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
          });
          let matchArtifact = artifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "trunk-annotations"
          })[0];
          if (matchArtifact) {
            let download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.TRUNK_TMPDIR}/annotations.zip`, Buffer.from(download.data));
          }
    - name: Unpack annotations artifact
      if: inputs.post-annotations == 'true'
      shell: bash
      env:
        TRUNK_TMPDIR: ${{ env.TRUNK_TMPDIR }}
      run: |
        # Unpack annotations artifact
        cd "${TRUNK_TMPDIR}" && unzip annotations.zip
    - name: Post annotations
      if: inputs.post-annotations == 'true'
      shell: bash
      run: |
        # Post annotations
        ${GITHUB_ACTION_PATH}/annotate.sh
      env:
        GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    - name: Upload landing state
      if: env.INPUT_UPLOAD_LANDING_STATE == 'true'
      continue-on-error: true
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: landing-state.json
        path: .trunk/landing-state.json
        overwrite: true
