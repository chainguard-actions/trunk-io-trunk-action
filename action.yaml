name: Trunk Check
author: trunk.io
description: The official trunk.io GitHub action

branding:
  icon: check
  color: green

inputs:
  trunk-path:
    description:
      Path to Trunk Launcher. If not provided, we'll look for it the repo root, `.trunk/bin` and
      `tools/`. If it can't be found anywhere and is not provided explicitly, we'll download it on
      demand.
    required: false

  label:
    description:
      Label to append to the check run name (useful if running Trunk Check on multiple platforms)
    deprecationMessage: "Use `arguments: --github-label=value` instead."
    required: false

  arguments:
    description: Extra arguments to pass to trunk
    required: false

  check-mode:
    description:
      Trunk check mode. Leave unset to autodetect. Set to 'all' to check the entire repository. Set
      to 'populate_cache_only' in a dedicated workflow to populate the GitHub Actions cache with
      Trunk artifacts (see docs for more details).
    required: false

  check-all-mode:
    description:
      If set to "hold-the-line", computes new/existing issues by comparing to previous upload.
    required: false
    default: ""

  check-run-id:
    description: Check run ID. If set, posts annotations using CheckService.
    required: false

  cache:
    description:
      Cache trunk downloads and results between runs. Caching is only needed when using ephemeral CI
      runners.
    required: false
    default: "true"

  cache-key:
    description:
      A key unique to the repo/branch this action is being run on (e.g. the repo name and branch)
    required: false

  post-init:
    description: Steps to run after auto-init / before check
    required: false

  github-token:
    description: For overriding github.token
    required: false

  trunk-token:
    description:
      You can find a per-repo API token in the Trunk web app settings. This will cause results to be
      uploaded to the Trunk web app if this job is a scheduled job running on a branch, or if
      `check-mode` is set to 'all'.
    required: false

  upload-series:
    description:
      Upload series name, for when `trunk-token` is provided. If not provided, we'll use the branch
      name.
    required: false

  save-annotations:
    description:
      Save annotations as an artifact instead of posting them from this action. This is neccesary if
      your repository will be used with forks as they will will not have permissions to upload
      annotations. By default forks will be auto-detected.
    required: false
    default: auto

  post-annotations:
    description:
      Post annotations previously uploaded with the `save-annotations` option (specific to posting
      annotations from forks).
    required: false
    default: "false"

  setup-deps:
    description:
      Install dependencies for trunk check that the trunk CLI does not manage. This is only
      necessary if you have Node dependencies in your package.json that your Node linters need (e.g.
      eslint dependencies, or @types packages).
    required: false
    default: "false"

  debug:
    description: Internal use only
    required: false
    default: "false"

  timeout-seconds:
    description:
      Timeout seconds before we kill the long running trunk check process via unix timeout command.
      Default setting of 0 seconds disables the timeout.
    required: false
    default: 0

  cat-trunk-debug-logs:
    description: Option to cat .trunk/logs/cli.log && .trunk/logs/daemon.log
    required: false
    default: false

  lfs-checkout:
    description: Option to checkout LFS files
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up inputs
      shell: bash
      env:
        VAL_GITHUB_TOKEN_DEFAULT: ${{ github.token }}
        VAL_CHECK_MODE: ${{ inputs.check-mode }}
        VAL_GITHUB_TOKEN: ${{ inputs.github-token }}
        VAL_TRUNK_TOKEN: ${{ inputs.trunk-token }}
        VAL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        VAL_PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        VAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        VAL_PR_NUMBER: ${{ github.event.pull_request.number }}
        VAL_REF_NAME: ${{ github.ref_name }}
        VAL_ARGUMENTS: ${{ inputs.arguments }}
        VAL_CACHE: ${{ inputs.cache }}
        VAL_CACHE_KEY: ${{ inputs.cache-key }}
        VAL_RUNNER_OS: ${{ runner.os }}
        VAL_TRUNK_YAML_HASH: ${{ hashFiles('.trunk/trunk.yaml') }}
        VAL_CAT_TRUNK_DEBUG_LOGS: ${{ inputs.cat-trunk-debug-logs }}
        VAL_CHECK_ALL_MODE: ${{ inputs.check-all-mode }}
        VAL_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        VAL_DEBUG: ${{ inputs.debug }}
        VAL_LABEL: ${{ inputs.label }}
        VAL_SETUP_DEPS: ${{ inputs.setup-deps }}
        VAL_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        VAL_TRUNK_PATH: ${{ inputs.trunk-path }}
        VAL_UPLOAD_SERIES: ${{ inputs.upload-series }}
        VAL_LFS_CHECKOUT: ${{ inputs.lfs-checkout }}
      run: |
        # Write NAME=VALUE to $GITHUB_ENV, stripping newlines so a value cannot add extra entries.
        write_env() {
          local name="$1"
          local value
          value="$(printf '%s' "$2" | tr -d '\n\r')"
          printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
        }

        write_env GITHUB_TOKEN "${VAL_GITHUB_TOKEN_DEFAULT}"
        write_env TRUNK_LAUNCHER_QUIET false

        # First arg is field to fetch, second arg is default value or empty
        payload() {
          if [ $# -lt 2 ]; then
            DEFAULT_VALUE=empty
          else
            DEFAULT_VALUE=\"$2\"
          fi
          if command -v jq >/dev/null; then
            jq -r ".inputs.payload | fromjson | .$1 // ${DEFAULT_VALUE}" "${TEST_GITHUB_EVENT_PATH:-${GITHUB_EVENT_PATH}}"
          else
            echo "::error::jq not installed on system!"
            exit 1
          fi
        }

        # Every inputs.field should be referenced as INPUT_FIELD later in the action. This allows
        # the field to be set either as an argument to the github action or via inputs.json.
        if [[ "${VAL_CHECK_MODE}" == "payload" ]]; then

          INPUT_GITHUB_TOKEN=$(payload githubToken)
          INPUT_TRUNK_TOKEN=$(payload trunkToken)
          echo "::add-mask::${INPUT_GITHUB_TOKEN}"
          echo "::add-mask::${INPUT_TRUNK_TOKEN}"

          write_env INPUT_GITHUB_TOKEN "${INPUT_GITHUB_TOKEN}"
          write_env INPUT_TRUNK_TOKEN "${INPUT_TRUNK_TOKEN}"
          write_env TRUNK_TOKEN "${INPUT_TRUNK_TOKEN}"

          while read -r env_name field default_value; do
            [[ -z ${env_name} ]] && continue
            # Upstream ignored payload lookup failures here; keep that behavior.
            raw="$(payload "${field}" ${default_value:+"${default_value}"})" || true
            write_env "${env_name}" "${raw}"
          done <<'FIELDS'
        TRUNK_API_ADDRESS trunkApiAddress
        GITHUB_EVENT_PULL_REQUEST_BASE_REPO_OWNER pullRequest.base.repo.owner.login
        GITHUB_EVENT_PULL_REQUEST_BASE_REPO_NAME pullRequest.base.repo.name
        GITHUB_EVENT_PULL_REQUEST_BASE_SHA pullRequest.base.sha
        GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK pullRequest.head.repo.fork
        GITHUB_EVENT_PULL_REQUEST_HEAD_SHA pullRequest.head.sha
        GITHUB_EVENT_PULL_REQUEST_NUMBER pullRequest.number
        INPUT_ARGUMENTS arguments
        INPUT_CACHE cache
        INPUT_CACHE_KEY cacheKey
        INPUT_CACHE_PATH cachePath
        INPUT_CHECK_ALL_MODE checkAllMode
        INPUT_CHECK_MODE checkMode
        INPUT_CHECK_RUN_ID checkRunId
        INPUT_DEBUG debug
        INPUT_GITHUB_REF_NAME targetRefName
        INPUT_LABEL label
        INPUT_SETUP_CACHE_KEY setupCacheKey
        INPUT_SETUP_DEPS setupDeps
        INPUT_TARGET_CHECKOUT targetCheckout
        INPUT_TARGET_CHECKOUT_REF targetCheckoutRef
        INPUT_TRUNK_PATH trunkPath
        INPUT_UPLOAD_LANDING_STATE uploadLandingState
        INPUT_UPLOAD_SERIES uploadSeries
        INPUT_UPLOAD_ID uploadId
        INPUT_AUTOFIX_AND_PUSH autofixAndPush
        INPUT_LFS_CHECKOUT lfsCheckout true
        FIELDS

        else

          write_env INPUT_GITHUB_TOKEN "${VAL_GITHUB_TOKEN}"
          write_env INPUT_TRUNK_TOKEN "${VAL_TRUNK_TOKEN}"
          write_env TRUNK_TOKEN "${VAL_TRUNK_TOKEN}"
          write_env GITHUB_EVENT_PULL_REQUEST_BASE_SHA "${VAL_PR_BASE_SHA}"
          write_env GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK "${VAL_PR_HEAD_REPO_FORK}"
          write_env GITHUB_EVENT_PULL_REQUEST_HEAD_SHA "${VAL_PR_HEAD_SHA}"
          write_env GITHUB_EVENT_PULL_REQUEST_NUMBER "${VAL_PR_NUMBER}"
          write_env GITHUB_REF_NAME "${VAL_REF_NAME}"
          write_env INPUT_ARGUMENTS "${VAL_ARGUMENTS}"
          write_env INPUT_CACHE "${VAL_CACHE}"
          write_env INPUT_CACHE_KEY "trunk-${VAL_CACHE_KEY}-${VAL_RUNNER_OS}-${VAL_TRUNK_YAML_HASH}"
          write_env INPUT_CACHE_PATH '~/.cache/trunk'
          write_env INPUT_CAT_TRUNK_DEBUG_LOGS "${VAL_CAT_TRUNK_DEBUG_LOGS}"
          write_env INPUT_CHECK_ALL_MODE "${VAL_CHECK_ALL_MODE}"
          write_env INPUT_CHECK_MODE "${VAL_CHECK_MODE}"
          write_env INPUT_CHECK_RUN_ID "${VAL_CHECK_RUN_ID}"
          write_env INPUT_DEBUG "${VAL_DEBUG}"
          write_env INPUT_GITHUB_REF_NAME "${VAL_REF_NAME}"
          write_env INPUT_LABEL "${VAL_LABEL}"
          write_env INPUT_SETUP_CACHE_KEY "${VAL_CACHE_KEY}"
          write_env INPUT_SETUP_DEPS "${VAL_SETUP_DEPS}"
          write_env INPUT_TARGET_CHECKOUT ""
          write_env INPUT_TARGET_CHECKOUT_REF ""
          write_env INPUT_TIMEOUT_SECONDS "${VAL_TIMEOUT_SECONDS}"
          write_env INPUT_TRUNK_PATH "${VAL_TRUNK_PATH}"
          write_env INPUT_UPLOAD_LANDING_STATE false
          write_env INPUT_UPLOAD_SERIES "${VAL_UPLOAD_SERIES}"
          write_env INPUT_UPLOAD_ID ""
          write_env INPUT_AUTOFIX_AND_PUSH ""
          write_env INPUT_LFS_CHECKOUT "${VAL_LFS_CHECKOUT}"

        fi

    - name: Checkout
      if: env.INPUT_TARGET_CHECKOUT
      uses: chainguard-actions/actions-checkout@5ec64c0c3db996bb66e02e8c680b0736fc123f6d # v6.0.2
      with:
        lfs: ${{ env.INPUT_LFS_CHECKOUT && inputs.lfs-checkout }}
        submodules: recursive
        repository: ${{ env.INPUT_TARGET_CHECKOUT }}
        ref: ${{ env.INPUT_TARGET_CHECKOUT_REF }}
        token: ${{ env.INPUT_GITHUB_TOKEN }}

    - name: Locate trunk
      shell: bash
      run: ${GITHUB_ACTION_PATH}/setup/locate_trunk.sh

    - name: Determine check mode
      shell: bash
      run: |
        # Determine check mode
        ${GITHUB_ACTION_PATH}/determine_check_mode.sh

    - name: Init on-demand
      shell: bash
      run: |
        if [[ ! -e .trunk/trunk.yaml ]]; then
          "${TRUNK_PATH:-trunk}" --ci init
          echo "INITIALIZED_TRUNK=true" >>"$GITHUB_ENV"
        fi

    - name: Detect setup strategy
      shell: bash
      run: |
        if [[ -e .trunk/setup-ci ]]; then
          echo "INPUT_SETUP_DEPS=true" >>"$GITHUB_ENV"
        else
          mkdir -p .trunk
          ln -s "${GITHUB_ACTION_PATH}/setup-env" .trunk/setup-ci
          echo .trunk/setup-ci >>.git/info/exclude
        fi

    - name: Set up env
      uses: ./.trunk/setup-ci
      if: env.INPUT_SETUP_DEPS == 'true'
      with:
        cache-key: ${{ env.INPUT_SETUP_CACHE_KEY }}

    - name: Post-init steps
      if: inputs.post-init
      shell: bash
      env:
        POST_INIT_CMD: ${{ inputs.post-init }}
      run: |
        post_init_script="$(mktemp)"
        printf '%s\n' "${POST_INIT_CMD}" >"${post_init_script}"
        bash -eo pipefail "${post_init_script}"

    - name: Cache Linters/Formatters
      if: env.TRUNK_CHECK_MODE != 'none' && env.INPUT_CACHE == 'true'
      uses: chainguard-actions/actions-cache@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: ${{ env.INPUT_CACHE_PATH }}
        key: ${{ env.INPUT_CACHE_KEY }}

    - name: Run trunk check on pull request
      if: env.TRUNK_CHECK_MODE == 'pull_request'
      shell: bash
      run: |
        # Run 'trunk check' on pull request
        if [[ "${TIMEOUT_SECONDS}" != "0" ]]; then
          timeout "${TIMEOUT_SECONDS}" "${GITHUB_ACTION_PATH}/pull_request.sh"
        else
          "${GITHUB_ACTION_PATH}/pull_request.sh"
        fi
      env:
        INPUT_SAVE_ANNOTATIONS: ${{ inputs.save-annotations }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}

    - name: Run trunk check on push
      if: env.TRUNK_CHECK_MODE == 'push'
      shell: bash
      run: |
        # Run 'trunk check' on push
        if [[ "${TIMEOUT_SECONDS}" != "0" ]]; then
          timeout "${TIMEOUT_SECONDS}" "${GITHUB_ACTION_PATH}/push.sh"
        else
          "${GITHUB_ACTION_PATH}/push.sh"
        fi
      env:
        GITHUB_EVENT_AFTER: ${{ env.GITHUB_EVENT_AFTER || github.event.after }}
        GITHUB_EVENT_BEFORE: ${{ env.GITHUB_EVENT_BEFORE || github.event.before }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}

    - name: Run trunk check on all
      if: env.TRUNK_CHECK_MODE == 'all'
      shell: bash
      run: |
        # Run 'trunk check' on all
        if [[ "${TIMEOUT_SECONDS}" != "0" ]]; then
          timeout "${TIMEOUT_SECONDS}" "${GITHUB_ACTION_PATH}/all.sh"
        else
          "${GITHUB_ACTION_PATH}/all.sh"
        fi
      env:
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}

    - name: Run trunk check on Trunk Merge
      if: env.TRUNK_CHECK_MODE == 'trunk_merge'
      shell: bash
      run: |
        # Run 'trunk check' on Trunk Merge
        if [[ "${TIMEOUT_SECONDS}" != "0" ]]; then
          timeout "${TIMEOUT_SECONDS}" "${GITHUB_ACTION_PATH}/trunk_merge.sh"
        else
          "${GITHUB_ACTION_PATH}/trunk_merge.sh"
        fi
      env:
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}

    - name: Cat Trunk Cli / Daemon logs
      if: always() && inputs.cat-trunk-debug-logs == 'true'
      shell: bash
      run: |
        echo "::group::.trunk/logs/cli.log"
        if [[ -f .trunk/logs/cli.log ]]; then
          cat .trunk/logs/cli.log
        else
          echo ".trunk/logs/cli.log doesn't exist"
        fi
        echo "::endgroup::"

        echo "::group::.trunk/logs/daemon.log"
        if [[ -f .trunk/logs/daemon.log ]]; then
          cat .trunk/logs/daemon.log
        else
          echo ".trunk/logs/daemon.log doesn't exist"
        fi
        echo "::endgroup::"

    - name: Run trunk install to populate the GitHub Actions cache
      if: env.TRUNK_CHECK_MODE == 'populate_cache_only'
      shell: bash
      run: |
        # Run 'trunk install' to populate the GitHub Actions cache
        ${GITHUB_ACTION_PATH}/populate_cache_only.sh

    - name: Upload annotations artifact
      if: always() && env.TRUNK_UPLOAD_ANNOTATIONS == 'true'
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: trunk-annotations
        overwrite: true
        path: ${{ env.TRUNK_TMPDIR }}/annotations.bin

    - name: Download annotations artifact
      if: inputs.post-annotations == 'true'
      uses: chainguard-actions/actions-github-script@90ea3578c9f973abcd1e50255ba3c1cd19216b51 # v9.0.0
      with:
        # TODO(chris): We can't use the official download artifact action yet: https://github.com/actions/download-artifact/issues/172
        script: |
          let artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
          });
          let matchArtifact = artifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "trunk-annotations"
          })[0];
          if (matchArtifact) {
            let download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(process.env.TRUNK_TMPDIR + '/annotations.zip', Buffer.from(download.data));
          }

    - name: Unpack annotations artifact
      if: inputs.post-annotations == 'true'
      run: |
        # Unpack annotations artifact
        cd "${TRUNK_TMPDIR}" && unzip annotations.zip
      shell: bash

    - name: Post annotations
      if: inputs.post-annotations == 'true'
      shell: bash
      run: |
        # Post annotations
        ${GITHUB_ACTION_PATH}/annotate.sh
      env:
        GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    - name: Upload landing state
      if: env.INPUT_UPLOAD_LANDING_STATE == 'true'
      continue-on-error: true
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: landing-state.json
        path: .trunk/landing-state.json
        overwrite: true
        if-no-files-found: warn

    - name: Cleanup temporary files
      if: always()
      shell: bash
      run: |
        # Cleanup temporary files
        ${GITHUB_ACTION_PATH}/cleanup.sh
