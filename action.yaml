name: Trunk Check
author: trunk.io
description: The official trunk.io GitHub action

branding:
  icon: check
  color: green

inputs:
  trunk-path:
    description:
      Path to Trunk Launcher. If not provided, we'll look for it the repo root, `.trunk/bin` and
      `tools/`. If it can't be found anywhere and is not provided explicitly, we'll download it on
      demand.
    required: false

  label:
    description:
      Label to append to the check run name (useful if running Trunk Check on multiple platforms)
    deprecationMessage: "Use `arguments: --github-label=value` instead."
    required: false

  arguments:
    description: Extra arguments to pass to trunk
    required: false

  check-mode:
    description:
      Trunk check mode. Leave unset to autodetect. Set to 'all' to check the entire repository. Set
      to 'populate_cache_only' in a dedicated workflow to populate the GitHub Actions cache with
      Trunk artifacts (see docs for more details).
    required: false

  check-all-mode:
    description:
      If set to "hold-the-line", computes new/existing issues by comparing to previous upload.
    deprecationMessage:
      The Trunk web app has been shut down; hold-the-line uploads are no longer supported.
    required: false
    default: ""

  cache:
    description:
      Cache trunk downloads and results between runs. Caching is only needed when using ephemeral CI
      runners.
    required: false
    default: "true"

  cache-key:
    description:
      A key unique to the repo/branch this action is being run on (e.g. the repo name and branch)
    required: false

  post-init:
    description:
      Trusted shell to run after auto-init / before check (caller-controlled escape hatch).
    required: false

  github-token:
    description:
      GitHub token for API/checkout. Defaults to github.token; pass a PAT/App secret only for extra
      permissions.
    required: false
    default: ${{ github.token }}

  trunk-token:
    description:
      You can find a per-repo API token in the Trunk web app settings. This will cause results to be
      uploaded to the Trunk web app if this job is a scheduled job running on a branch, or if
      `check-mode` is set to 'all'.
    deprecationMessage: The Trunk web app has been shut down; uploads are no longer supported.
    required: false

  upload-series:
    description:
      Upload series name, for when `trunk-token` is provided. If not provided, we'll use the branch
      name.
    deprecationMessage: The Trunk web app has been shut down; uploads are no longer supported.
    required: false

  save-annotations:
    description:
      Save annotations as an artifact instead of posting them from this action. This is neccesary if
      your repository will be used with forks as they will will not have permissions to upload
      annotations. By default forks will be auto-detected.
    required: false
    default: auto

  post-annotations:
    description:
      Post annotations previously uploaded with the `save-annotations` option (specific to posting
      annotations from forks).
    required: false
    default: "false"

  setup-deps:
    description:
      Install dependencies for trunk check that the trunk CLI does not manage. This is only
      necessary if you have Node dependencies in your package.json that your Node linters need (e.g.
      eslint dependencies, or @types packages).
    required: false
    default: "false"

  debug:
    description: Internal use only
    required: false
    default: "false"

  timeout-seconds:
    description:
      Timeout seconds before we kill the long running trunk check process via unix timeout command.
      Default setting of 0 seconds disables the timeout.
    required: false
    default: 0

  cat-trunk-debug-logs:
    description: Option to cat .trunk/logs/cli.log && .trunk/logs/daemon.log
    required: false
    default: false

  lfs-checkout:
    description: Option to checkout LFS files
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up inputs
      shell: bash
      env:
        IN_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        IN_CHECK_MODE: ${{ inputs.check-mode }}
        IN_DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        IN_GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_TRUNK_TOKEN: ${{ inputs.trunk-token }}
        IN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        IN_PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        IN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IN_PR_NUMBER: ${{ github.event.pull_request.number }}
        IN_REF_NAME: ${{ github.ref_name }}
        IN_ARGUMENTS: ${{ inputs.arguments }}
        IN_CACHE: ${{ inputs.cache }}
        IN_CACHE_KEY: ${{ inputs.cache-key }}
        IN_RUNNER_OS: ${{ runner.os }}
        IN_TRUNK_YAML_HASH: ${{ hashFiles('.trunk/trunk.yaml') }}
        IN_CAT_TRUNK_DEBUG_LOGS: ${{ inputs.cat-trunk-debug-logs }}
        IN_CHECK_ALL_MODE: ${{ inputs.check-all-mode }}
        IN_DEBUG: ${{ inputs.debug }}
        IN_LABEL: ${{ inputs.label }}
        IN_SETUP_DEPS: ${{ inputs.setup-deps }}
        IN_TRUNK_PATH: ${{ inputs.trunk-path }}
        IN_UPLOAD_SERIES: ${{ inputs.upload-series }}
        IN_LFS_CHECKOUT: ${{ inputs.lfs-checkout }}
      run: | # zizmor: ignore[github-env]
        # Write a single-line KEY=value entry to GITHUB_ENV, stripping CR/LF from the value so
        # it cannot inject additional environment variables.
        put() {
          local safe
          safe=$(printf '%s' "$2" | tr -d '\n\r')
          printf '%s=%s\n' "$1" "${safe}" >>"${GITHUB_ENV}"
        }

        put TRUNK_LAUNCHER_QUIET false
        put INPUT_TIMEOUT_SECONDS "${IN_TIMEOUT_SECONDS}"

        # First arg is field to fetch, second arg is default value or empty
        payload() {
          if [ $# -lt 2 ]; then
            DEFAULT_VALUE=empty
          else
            DEFAULT_VALUE=\"$2\"
          fi
          if command -v jq >/dev/null; then
            jq -r ".inputs.payload | fromjson | .$1 // ${DEFAULT_VALUE}" "${TEST_GITHUB_EVENT_PATH:-${GITHUB_EVENT_PATH}}"
          else
            echo "::error::jq not installed on system!"
            exit 1
          fi
        }

        # Fetch a payload field and write it to GITHUB_ENV. Like the original heredoc, a failing
        # lookup does not stop the step.
        put_payload() {
          local key="$1" raw
          shift
          raw="$(payload "$@")" || true
          put "${key}" "${raw}"
        }

        # Every inputs.field should be referenced as INPUT_FIELD later in the action. This allows
        # the field to be set either as an argument to the github action or via inputs.json.
        if [[ "${IN_CHECK_MODE}" == "payload" ]]; then

          INPUT_GITHUB_TOKEN=$(payload githubToken)
          if [[ -z ${INPUT_GITHUB_TOKEN} ]]; then
            # Fall back to the workflow's default token when the payload omits one so
            # GITHUB_TOKEN is never empty (payload mode previously always inherited github.token).
            INPUT_GITHUB_TOKEN="${IN_DEFAULT_GITHUB_TOKEN}"
          fi
          INPUT_TRUNK_TOKEN=$(payload trunkToken)
          if [[ -n ${INPUT_GITHUB_TOKEN} ]]; then
            echo "::add-mask::${INPUT_GITHUB_TOKEN}"
          fi
          if [[ -n ${INPUT_TRUNK_TOKEN} ]]; then
            echo "::add-mask::${INPUT_TRUNK_TOKEN}"
          fi

          put GITHUB_TOKEN "${INPUT_GITHUB_TOKEN}"
          put INPUT_GITHUB_TOKEN "${INPUT_GITHUB_TOKEN}"
          put INPUT_TRUNK_TOKEN "${INPUT_TRUNK_TOKEN}"
          put TRUNK_TOKEN "${INPUT_TRUNK_TOKEN}"

          put_payload TRUNK_API_ADDRESS trunkApiAddress

          put_payload GITHUB_EVENT_PULL_REQUEST_BASE_REPO_OWNER pullRequest.base.repo.owner.login
          put_payload GITHUB_EVENT_PULL_REQUEST_BASE_REPO_NAME pullRequest.base.repo.name
          put_payload GITHUB_EVENT_PULL_REQUEST_BASE_SHA pullRequest.base.sha
          put_payload GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK pullRequest.head.repo.fork
          put_payload GITHUB_EVENT_PULL_REQUEST_HEAD_SHA pullRequest.head.sha
          put_payload GITHUB_EVENT_PULL_REQUEST_NUMBER pullRequest.number
          put_payload INPUT_ARGUMENTS arguments
          put_payload INPUT_CACHE cache
          put_payload INPUT_CACHE_KEY cacheKey
          put_payload INPUT_CACHE_PATH cachePath
          put_payload INPUT_CHECK_ALL_MODE checkAllMode
          put_payload INPUT_CHECK_MODE checkMode
          put_payload INPUT_DEBUG debug
          put_payload INPUT_GITHUB_REF_NAME targetRefName
          put_payload INPUT_LABEL label
          put_payload INPUT_SETUP_CACHE_KEY setupCacheKey
          put_payload INPUT_SETUP_DEPS setupDeps
          put_payload INPUT_TARGET_CHECKOUT targetCheckout
          put_payload INPUT_TARGET_CHECKOUT_REF targetCheckoutRef
          put_payload INPUT_TRUNK_PATH trunkPath
          put_payload INPUT_UPLOAD_LANDING_STATE uploadLandingState
          put_payload INPUT_UPLOAD_SERIES uploadSeries
          put_payload INPUT_UPLOAD_ID uploadId
          put_payload INPUT_AUTOFIX_AND_PUSH autofixAndPush
          put_payload INPUT_LFS_CHECKOUT lfsCheckout true

        else

          if [[ -n "${IN_GITHUB_TOKEN}" ]]; then
            echo "::add-mask::${IN_GITHUB_TOKEN}"
          fi
          if [[ -n "${IN_TRUNK_TOKEN}" ]]; then
            echo "::add-mask::${IN_TRUNK_TOKEN}"
          fi

          put GITHUB_TOKEN "${IN_GITHUB_TOKEN}"
          put INPUT_GITHUB_TOKEN "${IN_GITHUB_TOKEN}"
          put INPUT_TRUNK_TOKEN "${IN_TRUNK_TOKEN}"
          put TRUNK_TOKEN "${IN_TRUNK_TOKEN}"
          put GITHUB_EVENT_PULL_REQUEST_BASE_SHA "${IN_PR_BASE_SHA}"
          put GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FORK "${IN_PR_HEAD_REPO_FORK}"
          put GITHUB_EVENT_PULL_REQUEST_HEAD_SHA "${IN_PR_HEAD_SHA}"
          put GITHUB_EVENT_PULL_REQUEST_NUMBER "${IN_PR_NUMBER}"
          put GITHUB_REF_NAME "${IN_REF_NAME}"
          put INPUT_ARGUMENTS "${IN_ARGUMENTS}"
          put INPUT_CACHE "${IN_CACHE}"
          put INPUT_CACHE_KEY "trunk-${IN_CACHE_KEY}-${IN_RUNNER_OS}-${IN_TRUNK_YAML_HASH}"
          # shellcheck disable=SC2088 # literal ~ is intended; actions/cache expands it
          put INPUT_CACHE_PATH '~/.cache/trunk'
          put INPUT_CAT_TRUNK_DEBUG_LOGS "${IN_CAT_TRUNK_DEBUG_LOGS}"
          put INPUT_CHECK_ALL_MODE "${IN_CHECK_ALL_MODE}"
          put INPUT_CHECK_MODE "${IN_CHECK_MODE}"
          put INPUT_DEBUG "${IN_DEBUG}"
          put INPUT_GITHUB_REF_NAME "${IN_REF_NAME}"
          put INPUT_LABEL "${IN_LABEL}"
          put INPUT_SETUP_CACHE_KEY "${IN_CACHE_KEY}"
          put INPUT_SETUP_DEPS "${IN_SETUP_DEPS}"
          put INPUT_TARGET_CHECKOUT ""
          put INPUT_TARGET_CHECKOUT_REF ""
          put INPUT_TRUNK_PATH "${IN_TRUNK_PATH}"
          put INPUT_UPLOAD_LANDING_STATE false
          put INPUT_UPLOAD_SERIES "${IN_UPLOAD_SERIES}"
          put INPUT_UPLOAD_ID ""
          put INPUT_AUTOFIX_AND_PUSH ""
          put INPUT_LFS_CHECKOUT "${IN_LFS_CHECKOUT}"

        fi

    - name: Checkout
      if: env.INPUT_TARGET_CHECKOUT
      uses: chainguard-actions/actions-checkout@5ec64c0c3db996bb66e02e8c680b0736fc123f6d # v6.0.2
      with:
        lfs: ${{ env.INPUT_LFS_CHECKOUT && inputs.lfs-checkout }}
        submodules: recursive
        repository: ${{ env.INPUT_TARGET_CHECKOUT }}
        ref: ${{ env.INPUT_TARGET_CHECKOUT_REF }}
        token: ${{ env.INPUT_GITHUB_TOKEN }}
        # Do not persist credentials for later steps; trunk's internal git
        # commands re-authenticate on demand via git_github.sh.
        persist-credentials: false

    - name: Locate trunk
      shell: bash
      run: ${GITHUB_ACTION_PATH}/setup/locate_trunk.sh

    - name: Determine check mode
      shell: bash
      run: |
        # Determine check mode
        ${GITHUB_ACTION_PATH}/determine_check_mode.sh

    - name: Init on-demand
      shell: bash
      run: |
        if [[ ! -e .trunk/trunk.yaml ]]; then
          "${TRUNK_PATH:-trunk}" --ci init
          echo "INITIALIZED_TRUNK=true" >>$GITHUB_ENV
        fi

    - name: Detect setup strategy
      shell: bash
      run: |
        if [[ -e .trunk/setup-ci ]]; then
          echo "INPUT_SETUP_DEPS=true" >>$GITHUB_ENV
        else
          mkdir -p .trunk
          ln -s "${GITHUB_ACTION_PATH}/setup-env" .trunk/setup-ci
          echo .trunk/setup-ci >>.git/info/exclude
        fi

    - name: Set up env
      uses: ./.trunk/setup-ci
      if: env.INPUT_SETUP_DEPS == 'true'
      with:
        cache-key: ${{ env.INPUT_SETUP_CACHE_KEY }}

    - name: Post-init steps
      if: inputs.post-init
      shell: bash
      env:
        POST_INIT: ${{ inputs.post-init }}
      run: bash --noprofile --norc -eo pipefail -c "$POST_INIT"

    - name: Cache Linters/Formatters
      if: env.TRUNK_CHECK_MODE != 'none' && env.INPUT_CACHE == 'true'
      uses: chainguard-actions/actions-cache@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: ${{ env.INPUT_CACHE_PATH }}
        key: ${{ env.INPUT_CACHE_KEY }}

    - name: Run trunk check on pull request
      if: env.TRUNK_CHECK_MODE == 'pull_request'
      shell: bash
      env:
        INPUT_SAVE_ANNOTATIONS: ${{ inputs.save-annotations }}
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh pull_request.sh

    - name: Run trunk check on push
      if: env.TRUNK_CHECK_MODE == 'push'
      shell: bash
      env:
        GITHUB_EVENT_AFTER: ${{ env.GITHUB_EVENT_AFTER || github.event.after }}
        GITHUB_EVENT_BEFORE: ${{ env.GITHUB_EVENT_BEFORE || github.event.before }}
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh push.sh

    - name: Run trunk check on all
      if: env.TRUNK_CHECK_MODE == 'all'
      shell: bash
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh all.sh

    - name: Run trunk check on Trunk Merge
      if: env.TRUNK_CHECK_MODE == 'trunk_merge'
      shell: bash
      run: ${GITHUB_ACTION_PATH}/run_with_timeout.sh trunk_merge.sh

    - name: Cat Trunk Cli / Daemon logs
      if: always() && inputs.cat-trunk-debug-logs == 'true'
      shell: bash
      run: |
        echo "::group::.trunk/logs/cli.log"
        if [[ -f .trunk/logs/cli.log ]]; then
          cat .trunk/logs/cli.log
        else
          echo ".trunk/logs/cli.log doesn't exist"
        fi
        echo "::endgroup::"

        echo "::group::.trunk/logs/daemon.log"
        if [[ -f .trunk/logs/daemon.log ]]; then
          cat .trunk/logs/daemon.log
        else
          echo ".trunk/logs/daemon.log doesn't exist"
        fi
        echo "::endgroup::"

    - name: Run trunk install to populate the GitHub Actions cache
      if: env.TRUNK_CHECK_MODE == 'populate_cache_only'
      shell: bash
      run: |
        # Run 'trunk install' to populate the GitHub Actions cache
        ${GITHUB_ACTION_PATH}/populate_cache_only.sh

    - name: Upload annotations artifact
      if: always() && env.TRUNK_UPLOAD_ANNOTATIONS == 'true'
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: trunk-annotations
        overwrite: true
        path: ${{ env.TRUNK_TMPDIR }}/annotations.bin

    - name: Download annotations artifact
      if: inputs.post-annotations == 'true'
      uses: chainguard-actions/actions-github-script@90ea3578c9f973abcd1e50255ba3c1cd19216b51 # v9.0.0
      env:
        WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        TRUNK_TMPDIR: ${{ env.TRUNK_TMPDIR }}
      with:
        # TODO(chris): We can't use the official download artifact action yet: https://github.com/actions/download-artifact/issues/172
        script: |
          const runId = Number(process.env.WORKFLOW_RUN_ID);
          let artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
          });
          let matchArtifact = artifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "trunk-annotations"
          })[0];
          if (matchArtifact) {
            let download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.TRUNK_TMPDIR}/annotations.zip`, Buffer.from(download.data));
          }

    - name: Unpack annotations artifact
      if: inputs.post-annotations == 'true'
      shell: bash
      env:
        TRUNK_TMPDIR: ${{ env.TRUNK_TMPDIR }}
      run: |
        # Unpack annotations artifact
        cd "${TRUNK_TMPDIR}" && unzip annotations.zip

    - name: Post annotations
      if: inputs.post-annotations == 'true'
      shell: bash
      run: |
        # Post annotations
        ${GITHUB_ACTION_PATH}/annotate.sh
      env:
        GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    - name: Upload landing state
      if: env.INPUT_UPLOAD_LANDING_STATE == 'true'
      continue-on-error: true
      uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
      with:
        name: landing-state.json
        path: .trunk/landing-state.json
        overwrite: true
        if-no-files-found: warn

    - name: Cleanup temporary files
      if: always()
      shell: bash
      run: |
        # Cleanup temporary files
        ${GITHUB_ACTION_PATH}/cleanup.sh
