name: Test basic install (no tools input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.6
          plugins:
            sources:
              - id: trunk
                ref: v1.6.6
                uri: https://github.com/trunk-io/plugins
          lint:
            enabled: []
          tools:
            enabled: []
          actions:
            enabled: []
          EOF

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert trunk was installed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Verify trunk is on PATH
            if ! command -v trunk >/dev/null 2>&1; then
              echo "FAIL: trunk not found on PATH after action succeeded"
              exit 1
            fi
            echo "PASS: trunk installed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/config issue expected in CI)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
