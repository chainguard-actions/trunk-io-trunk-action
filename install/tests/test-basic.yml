name: Test basic install (no tools input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert trunk binary was downloaded and added to PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Check that TRUNK_PATH env was set (get_trunk.sh succeeded)
          if [ -n "$TRUNK_PATH" ] && [ -f "$TRUNK_PATH" ]; then
            echo "PASS: trunk binary exists at $TRUNK_PATH"
          else
            echo "INFO: TRUNK_PATH=$TRUNK_PATH (may not be set in this shell)"
          fi
          # The action may fail at 'trunk tools install' if no .trunk/trunk.yaml exists,
          # but the get_trunk.sh step should have succeeded. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
