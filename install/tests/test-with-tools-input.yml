name: Test with tools input specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config with a tool enabled
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.2
          plugins:
            sources:
              - id: trunk
                ref: v1.6.2
                uri: https://github.com/trunk-io/plugins
          lint:
            enabled: []
          tools:
            enabled:
              - gh@2.40.1
          actions:
            enabled: []
          EOF

      - id: action
        uses: .
        with:
          tools: gh
        continue-on-error: true

      - name: Assert trunk was installed and tools input was accepted
        run: |
          echo "Checking trunk in PATH..."
          if command -v trunk >/dev/null 2>&1; then
            echo "PASS: trunk is available in PATH"
          else
            echo "INFO: trunk not found via 'command -v trunk', checking TRUNK_PATH env..."
            if [ -n "${TRUNK_PATH:-}" ] && [ -x "${TRUNK_PATH}" ]; then
              echo "PASS: trunk binary found at TRUNK_PATH=$TRUNK_PATH"
            else
              echo "FAIL: trunk was not installed to PATH or TRUNK_PATH"
              exit 1
            fi
          fi
          echo "PASS: tools input was accepted by the action"
