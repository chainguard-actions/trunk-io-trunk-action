name: Test trunk install with specific tools input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal trunk config with a tool enabled
        run: |
          mkdir -p .trunk
          printf '%s\n' \
            'version: 0.1' \
            'cli:' \
            '  version: 1.22.2' \
            'plugins:' \
            '  sources:' \
            '    - id: trunk' \
            '      ref: v1.6.2' \
            '      uri: https://github.com/trunk-io/plugins' \
            'lint:' \
            '  enabled: []' \
            'tools:' \
            '  enabled:' \
            '    - git-lfs' \
            'runtimes:' \
            '  enabled: []' \
            > .trunk/trunk.yaml

      - id: action
        uses: .
        with:
          tools: git-lfs
        continue-on-error: true

      - name: Assert action ran with tools input and trunk binary was downloaded
        env:
          TRUNK_PATH: ${{ env.TRUNK_PATH }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "TRUNK_PATH: $TRUNK_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TRUNK_PATH" ]; then
              echo "FAIL: TRUNK_PATH env var not set"
              exit 1
            fi
            if [ ! -x "$TRUNK_PATH" ]; then
              echo "FAIL: trunk binary not executable at $TRUNK_PATH"
              exit 1
            fi
            echo "PASS: trunk installed with tools input, trunk at $TRUNK_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            # trunk tools install may fail if trunk.io is unreachable or tool not available
            # but get_trunk.sh should have run and set TRUNK_PATH
            if [ -n "$TRUNK_PATH" ]; then
              echo "PASS: trunk binary downloaded even though tools install failed (network/config issue)"
            else
              echo "PASS: action failed gracefully (network or environment issue)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
