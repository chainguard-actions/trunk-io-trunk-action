name: Test with tools input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal trunk config with a tool enabled
        run: |
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<'EOF'
          version: 0.1
          cli:
            version: 1.22.6
          tools:
            enabled: []
          EOF

      - id: action
        uses: .
        with:
          tools: node
        continue-on-error: true

      - name: Assert action ran with tools input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (tool installed) or fail gracefully
          # (e.g. tool not found in trunk config). The key thing is that the
          # action was invoked with the tools input and processed it.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tools input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tools input and failed gracefully (expected without full trunk config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
