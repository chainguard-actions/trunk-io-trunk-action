name: Test no package manager detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no lock files exist in workspace
        run: |
          rm -f package-lock.json yarn.lock pnpm-lock.yaml

      - name: Run setup action (no package manager)
        id: action
        uses: .

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error when no package manager lock files are present"
