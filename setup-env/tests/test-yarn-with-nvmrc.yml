name: Test yarn package manager with .nvmrc
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove any existing lock files and version files
        run: |
          rm -f package-lock.json yarn.lock pnpm-lock.yaml .nvmrc .node-version .tool-versions

      - name: Create minimal yarn project with .nvmrc
        run: |
          # Create .nvmrc specifying node version
          echo "20" > .nvmrc
          # Create a minimal package.json
          cat > package.json <<'EOF'
          {
            "name": "test-yarn-project",
            "version": "1.0.0"
          }
          EOF
          # Create a minimal yarn.lock (empty but valid)
          cat > yarn.lock <<'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1
          EOF

      - name: Run setup action with yarn project
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran for yarn scenario
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with yarn project"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f package.json yarn.lock .nvmrc
