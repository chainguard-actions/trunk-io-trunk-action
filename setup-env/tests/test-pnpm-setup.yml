name: Test pnpm package manager detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove any existing lock files and version files
        run: |
          rm -f package-lock.json yarn.lock pnpm-lock.yaml .nvmrc .node-version .tool-versions

      - name: Create minimal pnpm project with packageManager field
        run: |
          # Create package.json with packageManager field specifying pnpm version
          cat > package.json <<'EOF'
          {
            "name": "test-pnpm-project",
            "version": "1.0.0",
            "packageManager": "pnpm@8.15.9",
            "engines": {
              "node": "20"
            }
          }
          EOF
          # Create a minimal pnpm-lock.yaml (lockfile v6 format, compatible with pnpm 8)
          cat > pnpm-lock.yaml <<'EOF'
          lockfileVersion: '6.0'

          settings:
            autoInstallPeers: true
            excludeLinksFromLockfile: false
          EOF
          # Create .nvmrc for node version
          echo "20" > .nvmrc

      - name: Run setup action with pnpm project
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran for pnpm scenario
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pnpm project"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f package.json pnpm-lock.yaml .nvmrc
